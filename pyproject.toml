[project]
name = "supply-chain-intel"
version = "0.1.0"
description = "Supply chain intelligence mini-platform: DQ checks, curated data product, delay-risk API."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.32,<1.0",
    "duckdb>=1.1,<2.0",
    "scikit-learn>=1.5,<2",
    "pandas>=2.2,<3",
    "google-genai>=1.0",
    "httpx>=0.27",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI's Query()/Depends() defaults are idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E501"]  # fixture CSV rows are clearer unwrapped

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: hits a running service over HTTP (needs `docker compose up` or BASE_URL)",
    "slow: builds the full warehouse from the real CSVs (seconds, still no infrastructure)",
]
addopts = "-ra -m 'not integration and not slow'"
filterwarnings = [
    # Third-party: starlette's TestClient nudging towards httpx2; not our code.
    "ignore::DeprecationWarning:fastapi.testclient",
    "ignore:Using `httpx` with `starlette.testclient`",
]
