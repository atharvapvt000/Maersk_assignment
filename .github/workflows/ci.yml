name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.7.20"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check . --output-format=github
      - run: uv run ruff format --check .

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - name: Standalone DQ gate on raw CSVs (fails if any check breaches its fail threshold)
        run: uv run python -m dq.dq_check --input data/raw --output data/reports/dq_report.json --fail-on fail
      - name: Unit tests
        run: >
          uv run pytest -m "not integration"
          --cov=app --cov=pipeline --cov=dq --cov=ml --cov=assistant
          --cov-report=term-missing:skip-covered --cov-report=xml
          --junitxml=junit-unit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            junit-unit.xml
            coverage.xml
            data/reports/dq_report.json

  build-and-integration:
    needs: [lint, unit-tests]
    runs-on: ubuntu-latest
    env:
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - name: Build image and start stack
        # No --wait: the one-shot `pipeline` service exits by design. The test session fixture
        # polls /health (up to 90 s) instead, which also covers slow runners.
        run: docker compose up --build --detach
      - name: Integration tests (real HTTP against the container)
        run: uv run pytest -m integration -v --junitxml=junit-integration.xml
      - name: Dump service logs
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: junit-integration.xml
      - name: Tear down
        if: always()
        run: docker compose down --volumes
